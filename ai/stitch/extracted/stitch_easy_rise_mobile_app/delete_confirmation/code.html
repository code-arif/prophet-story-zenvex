<body class="bg-background min-h-screen text-on-background font-body-main antialiased overflow-hidden">
<!-- Mock Background Content (Blurred Settings Screen) -->
<div aria-hidden="true" class="blurred-bg absolute inset-0 z-0 bg-surface-container-low p-gutter flex flex-col gap-card-gap-v">
<!-- Top App Bar Mock -->
<header class="flex items-center justify-between py-4">
<div class="flex items-center gap-3 text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
<h1 class="font-headline-md text-headline-md">সেটিংস</h1>
</div>
</header>
<!-- Dummy Content -->
<div class="bg-surface rounded-xl p-internal-padding shadow-[0_16px_32px_0_rgba(14,22,38,0.04)] border border-white/20">
<div class="flex items-center gap-4 border-b border-surface-variant pb-4 mb-4">
<span class="material-symbols-outlined text-outline" data-icon="person">person</span>
<div>
<p class="font-body-main text-body-main font-medium">প্রোফাইল তথ্য</p>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">নাম, ছবি এবং ইমেইল</p>
</div>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-error" data-icon="delete_forever">delete_forever</span>
<div>
<p class="font-body-main text-body-main font-medium text-error">অ্যাকাউন্ট মুছুন</p>
<p class="font-body-secondary text-body-secondary text-on-surface-variant">সব তথ্য স্থায়ীভাবে মুছে ফেলুন</p>
</div>
</div>
</div>
<div class="flex-1 bg-surface-variant/30 rounded-xl mt-4"></div>
</div>
<!-- Backdrop Overlay -->
<div class="absolute inset-0 bg-on-background/40 z-10"></div>
<!-- Bottom Sheet Container -->
<div class="absolute inset-x-0 bottom-0 z-20 flex flex-col items-center">
<!-- Sheet Content -->
<div class="glass-sheet w-full max-w-md rounded-t-[32px] p-gutter pt-8 pb-10 flex flex-col gap-6 animate-[slideUp_0.3s_ease-out]">
<!-- Handle -->
<div class="absolute top-4 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-outline-variant rounded-full"></div>
<!-- Header -->
<div class="flex flex-col items-center text-center gap-3">
<div class="w-16 h-16 rounded-full bg-error-container text-error flex items-center justify-center mb-2 shadow-[inset_0_2px_4px_rgba(255,255,255,0.5)]">
<span class="material-symbols-outlined text-3xl" data-icon="warning" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-error">এই কাজটি ফেরানো যাবে না</h2>
<p class="font-body-main text-body-main text-on-surface-variant px-2">
                    আপনার সব কাজের হিসাব, আয়ের খাতা এবং প্রোফাইল তথ্য চিরতরে মুছে যাবে।
                </p>
</div>
<!-- Confirmation Input -->
<div class="flex flex-col gap-2 w-full mt-2">
<label class="font-label-nav text-label-nav text-on-background ml-1" for="confirm-delete">
                    নিশ্চিত করতে "মুছুন" লিখুন
                </label>
<div class="relative">
<input class="w-full h-touch-target-min px-4 bg-surface-bright border border-outline-variant rounded-xl focus:border-error focus:ring-1 focus:ring-error transition-colors font-body-main text-body-main text-on-background placeholder:text-outline-variant outline-none" id="confirm-delete" placeholder="মুছুন" type="text"/>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 w-full mt-4">
<button class="w-full h-touch-target-min bg-[#DC2626] hover:bg-error text-white font-label-nav text-label-nav rounded-xl shadow-[0_4px_12px_rgba(220,38,38,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2" disabled="" id="btn-delete">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
                    সব তথ্য মুছে ফেলুন
                </button>
<button class="w-full h-touch-target-min bg-surface-container hover:bg-surface-container-high text-on-surface font-label-nav text-label-nav rounded-xl transition-all active:scale-[0.98] border border-outline-variant/30">
                    ফিরে যান
                </button>
</div>
</div>
</div>
<!-- Inline script for input validation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputElement = document.getElementById('confirm-delete');
            const deleteButton = document.getElementById('btn-delete');
            const requiredText = "মুছুন";

            inputElement.addEventListener('input', (e) => {
                if (e.target.value === requiredText) {
                    deleteButton.disabled = false;
                } else {
                    deleteButton.disabled = true;
                }
            });
        });
    </script>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
