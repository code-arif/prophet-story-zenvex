<style>
        .glass-card {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 1);
            border-left: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 16px 0 rgba(14, 22, 38, 0.04);
        }
        
        .blob-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(135deg, #EEF3FF 0%, #F7F9FF 100%);
            overflow: hidden;
        }

        .blob-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(29,111,242,0.15) 0%, rgba(29,111,242,0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        .blob-2 {
            position: absolute;
            bottom: 10%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(109,40,217,0.15) 0%, rgba(109,40,217,0) 70%);
            border-radius: 50%;
            filter: blur(80px);
        }

    body {

<body class="font-body-main text-on-surface antialiased bg-background min-h-screen relative flex flex-col">
<!-- Background Blobs -->
<div class="blob-bg">
<div class="blob-1"></div>
<div class="blob-2"></div>
</div>

<h1 class="font-headline-md text-headline-md text-primary dark:text-inverse-primary font-bold">ক্লায়েন্ট ঝুঁকি স্ক্রিনার</h1>
<button class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[#64748B]" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[calc(48px+24px)] pb-[calc(72px+24px)] px-margin-horizontal flex flex-col gap-card-gap-v max-w-md mx-auto w-full">

<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-[#0284C7] mt-0.5" data-icon="info">info</span>
<p class="font-body-main text-body-main text-on-surface flex-1">কাজ নেওয়ার আগে কয়েকটি প্রশ্ন — উত্তরগুলো আপনার ডিভাইসেই থাকবে</p>
</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-caption text-caption text-outline">প্রগতি</span>
<span class="font-label-nav text-label-nav text-primary-container font-medium">৪ / ১২</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-1.5 overflow-hidden">
<div class="bg-primary-container h-1.5 rounded-full" style="width: 33.33%"></div>
</div>
</div>
</div>
<!-- Question Card -->
<div class="glass-card rounded-[28px] p-internal-padding flex flex-col gap-6 mt-4">
<div class="flex flex-col gap-2">
<h2 class="font-headline-md text-[18px] leading-[24px] font-bold text-on-surface">চুক্তি হওয়ার আগেই কি প্ল্যাটফর্মের বাইরে যেতে বলছেন?</h2>
<p class="font-body-secondary text-body-secondary text-[#64748B]">এটি একটি সাধারণ প্রতারণার কৌশল হতে পারে।</p>
</div>
<!-- Answer Buttons -->
<div class="flex gap-4">
<button class="flex-1 h-[56px] rounded-[18px] flex items-center justify-center font-label-nav text-[16px] font-semibold bg-primary-container text-on-primary border border-primary-container shadow-sm active:scale-95 transition-transform duration-200">
                    হ্যাঁ
                </button>
<button class="flex-1 h-[56px] rounded-[18px] flex items-center justify-center font-label-nav text-[16px] font-semibold bg-white/50 backdrop-blur-md text-primary-container border border-primary-container hover:bg-primary-container/5 active:scale-95 transition-all duration-200">

                </button>
</div>

<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<button class="h-touch-target-min px-6 rounded-full bg-primary-container text-on-primary font-label-nav text-label-nav shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center gap-2">
