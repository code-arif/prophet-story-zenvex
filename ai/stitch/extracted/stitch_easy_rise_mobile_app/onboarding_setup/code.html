<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .blob-bg {
            background: linear-gradient(135deg, #EEF3FF 0%, #F7F9FF 100%);
            position: relative;
            overflow: hidden;
        }
        .blob-bg::before, .blob-bg::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
        }
        .blob-bg::before {
            background-color: #1D6FF2;
            width: 300px;
            height: 300px;
            top: -50px;
            left: -100px;
            animation: float1 10s infinite ease-in-out alternate;
        }
        .blob-bg::after {
            background-color: #6D28D9;
            width: 250px;
            height: 250px;
            bottom: -50px;
            right: -50px;
            animation: float2 12s infinite ease-in-out alternate;
        }
        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }
        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, -30px) scale(1.05); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 1);
            border-left: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 16px 32px 0 rgba(14, 22, 38, 0.04);
            position: relative;
            z-index: 10;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #1d6ff2;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(29, 111, 242, 0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="blob-bg min-h-screen flex flex-col font-body-main text-on-surface select-none">
<!-- Header -->

</button>
<div class="flex-1 max-w-[120px] mx-4 h-1.5 bg-outline-variant/30 rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-3/4 rounded-full"></div>
</div>
<button class="h-12 flex items-center justify-center text-outline font-label-nav text-label-nav active:opacity-70 transition-opacity">
            পরে করব
        </button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto hide-scrollbar px-gutter pb-[120px] pt-4 relative z-10">
<div class="glass-card rounded-[28px] p-6 space-y-8">
<!-- Section 1: Current Status -->
<section>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4">আপনি এখন কোথায়?</h2>
<div class="space-y-3">
<label class="flex items-center p-3 rounded-xl border border-transparent hover:bg-surface-container-low cursor-pointer transition-colors">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center mr-3"></div>
<span class="text-body-main font-body-main">এখনো শুরু করিনি</span>
<input class="hidden" name="status" type="radio"/>
</label>
<!-- Selected Option -->
<label class="flex items-center p-3 rounded-xl border border-primary-container bg-[#EDF3FF] cursor-pointer transition-colors relative overflow-hidden">
<div class="w-6 h-6 rounded-full border-2 border-primary-container flex items-center justify-center mr-3">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container"></div>
</div>
<span class="text-body-main font-body-main text-primary-fixed-variant">প্রথম কাজের চেষ্টা করছি</span>
<input checked="" class="hidden" name="status" type="radio"/>
</label>
<label class="flex items-center p-3 rounded-xl border border-transparent hover:bg-surface-container-low cursor-pointer transition-colors">

<label class="flex items-center p-3 rounded-xl border border-transparent hover:bg-surface-container-low cursor-pointer transition-colors">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center mr-3"></div>
<span class="text-body-main font-body-main">নিজের দল আছে</span>
<input class="hidden" name="status" type="radio"/>
</label>
</div>
</section>
<div class="h-px bg-outline-variant/20 w-full"></div>
<!-- Section 2: Hours -->

                </p>

<!-- Footer Sticky Area -->
<div class="fixed bottom-0 left-0 w-full px-gutter pb-6 pt-4 bg-gradient-to-t from-white via-white/90 to-transparent z-20">
<p class="text-center font-caption text-caption text-outline mb-4">সব তথ্য আপনার ডিভাইসেই থাকে, পরে বদলানো যাবে</p>
<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-headline-md text-[16px] rounded-[18px] active:scale-[0.98] transition-transform shadow-[0_4px_14px_rgba(29,111,242,0.3)] flex items-center justify-center">
            সংরক্ষণ করে এগোন
        </button>
</div>
<script>
        // Simple slider value update
        const rangeInput = document.querySelector('input[type="range"]');
        const displayValue = document.querySelector('.text-4xl');
        
        // Basic English to Bangla numeral converter
        const engToBdNum = (num) => {
            const bdNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            return num.toString().split('').map(char => bdNums[parseInt(char)] || char).join('');
        };

        if(rangeInput && displayValue) {
            rangeInput.addEventListener('input', (e) => {
                displayValue.textContent = engToBdNum(e.target.value);
            });
        }
    </script>
