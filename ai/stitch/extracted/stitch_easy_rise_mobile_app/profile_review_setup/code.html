<style>
        body {
            /* Animated Blob Background Gradient */
            background: linear-gradient(135deg, #EEF3FF 0%, #F7F9FF 100%);
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Background Blobs for Glassmorphism Depth */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        
        body::before {
            width: 400px;
            height: 400px;
            background: rgba(29, 111, 242, 0.15); /* Azure blob */
            top: -100px;
            right: -100px;
        }
        
        body::after {
            width: 300px;
            height: 300px;
            background: rgba(109, 40, 217, 0.15); /* Violet blob */
            bottom: -50px;
            left: -50px;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, 50px) rotate(180deg); }
            100% { transform: translate(20px, -40px) rotate(360deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 16px 32px 0 rgba(14, 22, 38, 0.04);
        }
        
        /* Hide scrollbar for clean UI but keep functionality */
        ::-webkit-scrollbar {
            display: none;
        }
        
        .form-input-ai {
            background-color: #F3EFFF;
            border: 1px solid #E2E8F0;
            transition: border-color 0.2s;
        }
        .form-input-ai:focus {
            outline: none;
            border-color: #1D6FF2;
            box-shadow: 0 0 0 1px #1D6FF2;
        }
    </style>
