<style>
        body {
            background: linear-gradient(135deg, #EEF3FF 0%, #F7F9FF 100%);
            -webkit-tap-highlight-color: transparent;
        }
        
        .blob-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .blob-1 {
            position: absolute;
            top: -10%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            background: rgba(29, 111, 242, 0.15); /* #1D6FF2 */
            filter: blur(80px);
            border-radius: 50%;
            animation: float1 15s ease-in-out infinite alternate;
        }
        
        .blob-2 {
            position: absolute;
            bottom: 20%;
            left: -20%;
            width: 80vw;
            height: 80vw;
            background: rgba(109, 40, 217, 0.1); /* #6D28D9 */
            filter: blur(100px);
            border-radius: 50%;
            animation: float2 20s ease-in-out infinite alternate;
        }

        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-30px, 50px) scale(1.1); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.15); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 16px 32px 0 rgba(14, 22, 38, 0.04);
            border-radius: 28px;
        }

        .glass-row {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 12px 0 rgba(14, 22, 38, 0.02);
            border-radius: 20px;
        }

        .ring-gauge-container {
            position: relative;
            width: 64px;
            height: 64px;
        }

        .ring-gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: #E2E8F0;
            stroke-width: 6;
        }

        .ring-progress {
            fill: none;
            stroke: #1D6FF2;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 175.93; /* 2 * pi * r (28) */
            stroke-dashoffset: 102.04; /* 175.93 - (175.93 * 0.42) */
            transition: stroke-dashoffset 1s ease-out;
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }
    </style>
