<style>
        /* Custom styles for animations and specific effects not covered by Tailwind config */
        .glass-card {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

<body class="min-h-screen font-body-main text-on-surface full-bleed-gradient overflow-hidden relative selection:bg-primary-container selection:text-white">
<!-- Background Blobs for Modern Glassmorphism effect -->
<div class="absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] rounded-full blob-1 blur-3xl opacity-60 pointer-events-none z-0"></div>
<div class="absolute bottom-[10%] right-[-10%] w-[50vw] h-[50vw] rounded-full blob-2 blur-3xl opacity-50 pointer-events-none z-0"></div>
<!-- Top App Bar (Back Navigation only) -->
<div class="fixed top-0 w-full z-50 pt-safe px-gutter h-[64px] flex items-center bg-transparent">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-black/5 active:bg-black/10 transition-colors group cursor-pointer">
<span class="material-symbols-outlined text-[#0E1626] text-[24px] group-active:scale-90 transition-transform duration-200">arrow_back_ios_new</span>
</button>
</div>
<!-- Main Content Area -->
<main class="relative z-10 flex flex-col justify-center items-center min-h-screen px-gutter pt-[80px] pb-safe">
<!-- Frosted Glass Card -->
<div class="w-full max-w-md glass-card rounded-glass p-6 md:p-8 flex flex-col gap-8 transform transition-all duration-300">
<!-- Header Section -->
<div class="flex flex-col gap-2 items-center text-center">
<h1 class="font-headline-md text-headline-md text-on-surface">আপনার ফোন নম্বর</h1>
<p class="font-body-main text-body-main text-on-surface-variant">একটি ছয় অঙ্কের কোড পাঠানো হবে</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault(); alert('কোড পাঠানো হচ্ছে...');">
<!-- Phone Input Row -->
<div class="flex flex-row gap-3">
<!-- Country Code Chip -->
<div class="flex items-center justify-center bg-[#EDF3FF] rounded-xl h-[56px] px-4 border border-transparent shadow-sm">
<span class="font-headline-md text-[16px] text-on-surface whitespace-nowrap">+৮৮০</span>
</div>
<!-- Phone Number Field -->
<div class="relative flex-1">
<input autocomplete="tel-national" class="w-full h-[56px] rounded-xl border border-outline-variant bg-white/80 focus:bg-white px-4 font-headline-md text-[18px] text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="phone_number" placeholder="১৭XXXXXXXX" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[56px] min-h-touch-target-min rounded-xl bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center shadow-lg shadow-primary-container/20 group" type="submit">
<span class="font-headline-md text-[16px] text-white">কোড পাঠান</span>
<span class="material-symbols-outlined text-white ml-2 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-200 text-[20px]">arrow_forward</span>
</button>
</form>
</div>
</main>
<script>
        // Simple script to format input to Bengali digits if needed (optional enhancement)
        const phoneInput = document.getElementById('phone_number');
        const englishToBengali = {
            '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪',
            '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯'
        };

        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value;
            let bengaliValue = '';
            for(let i = 0; i < value.length; i++) {
                let char = value.charAt(i);
                bengaliValue += englishToBengali[char] || char;
            }
            // Temporarily disable to allow normal typing if user prefers, 
            // but this enforces visual style.
            // e.target.value = bengaliValue; 
        });
    </script>
