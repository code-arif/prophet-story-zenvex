<style>
        body {
            background: linear-gradient(135deg, #EEF3FF 0%, #F7F9FF 100%);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .blob-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out alternate;
        }
        
        .blob-1 {
            width: 400px; height: 400px;
            background-color: #1D6FF2; /* Azure */
            top: -100px; right: -100px;
        }
        
        .blob-2 {
            width: 300px; height: 300px;
            background-color: #6D28D9; /* Violet */
            bottom: 100px; left: -50px;
            animation-delay: -10s;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 50px) scale(1.1); }
            100% { transform: translate(20px, -40px) scale(0.9); }
        }

        .glass-panel {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 1);
            border-left: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 16px 32px 0 rgba(14, 22, 38, 0.04);
        }

        .gauge-circle {
            stroke-dasharray: 283; /* 2 * pi * r (45) */
            stroke-dashoffset: 87.73; /* 283 - (283 * 0.69) */
            transition: stroke-dashoffset 1.5s ease-out;
        }

        /* Hide scrollbar for horizontal scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .pb-safe { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(16px, env(safe-area-inset-top)); }

<script>
        // Trigger gauge animation on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const gauge = document.querySelector('.gauge-circle');
                if (gauge) {
                    // Force a reflow for transition to apply if needed, though usually css transition handles it on load if set in style tag properly.
                    // For robust animation, we set it to 0 dashoffset initially in JS, but we did it in CSS.
                    // To animate from 0 to 69%:
                    gauge.style.strokeDasharray = '283';
                    gauge.style.strokeDashoffset = '283';
                    
                    setTimeout(() => {
                        gauge.style.transition = 'stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1)';
                        gauge.style.strokeDashoffset = '87.73'; // 69%
                    }, 100);
                }
            }, 100);
        });
    </script>
