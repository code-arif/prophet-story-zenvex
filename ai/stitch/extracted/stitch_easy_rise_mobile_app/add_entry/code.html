<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 1);
            border-left: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 16px 0 rgba(14, 22, 38, 0.04);

            background: radial-gradient(circle, rgba(29, 111, 242, 0.15) 0%, rgba(29, 111, 242, 0) 70%);

      min-height: max(884px, 100dvh);

<body class="bg-background min-h-screen relative overflow-hidden flex items-end md:items-center justify-center font-body-main text-on-surface">
<!-- Background Decoration (Simulating ledger behind) -->
<div class="absolute inset-0 z-0 opacity-40">
<div class="absolute top-0 left-0 w-96 h-96 bg-blob-1 -translate-x-1/2 -translate-y-1/2 rounded-full"></div>
<div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-blob-2 translate-x-1/3 translate-y-1/3 rounded-full"></div>
</div>
<div class="absolute inset-0 bg-surface/30 backdrop-blur-[2px] z-10"></div> <!-- Overlay -->
<!-- Bottom Sheet -->
<div class="w-full max-w-md bg-surface/92 backdrop-blur-2xl rounded-t-[28px] md:rounded-[28px] shadow-[0_-8px_30px_0_rgba(14,22,38,0.08)] border-t border-l border-white/80 z-20 flex flex-col h-[751px] md:h-auto max-h-[795px]">
<!-- Drag Handle & Header -->
<div class="flex flex-col items-center pt-4 pb-2 px-margin-horizontal sticky top-0 bg-surface/92 backdrop-blur-2xl rounded-t-[28px] z-30 border-b border-outline-variant/20">
<div class="w-10 h-1.5 bg-outline-variant/50 rounded-full mb-4"></div>
<div class="w-full flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface">নতুন আয় যোগ করুন</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">close</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-margin-horizontal py-4 space-y-card-gap-v scrollbar-hide">
<!-- Date Picker (Simplified) -->
<div class="glass-panel rounded-xl p-internal-padding">
<label class="block font-caption text-caption text-on-surface-variant mb-2">তারিখ</label>
<div class="flex items-center justify-between border border-outline-variant/40 rounded-lg px-3 py-3 bg-surface-container-lowest">
<span class="font-body-main text-on-surface">আজ, ১২ অক্টোবর</span>
<span class="material-symbols-outlined text-outline">calendar_today</span>
</div>
</div>
<!-- Client/Job Dropdown -->
<div class="glass-panel rounded-xl p-internal-padding">
<label class="block font-caption text-caption text-on-surface-variant mb-2">ক্লায়েন্ট / প্রজেক্ট</label>
<div class="relative">
<select class="w-full border border-outline-variant/40 rounded-lg px-3 py-3 bg-surface-container-lowest appearance-none focus:ring-1 focus:ring-primary-container focus:border-primary-container text-on-surface">
<option>App Redesign (Upwork)</option>
<option>Logo Design (Fiverr)</option>
<option>অন্যান্য</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Currency & Amount -->
<div class="glass-panel rounded-xl p-internal-padding space-y-4">
<div>
<label class="block font-caption text-caption text-on-surface-variant mb-2">কারেন্সি</label>
<div class="flex gap-2">
<button class="flex-1 py-2 rounded-lg bg-primary-container text-on-primary font-body-secondary text-body-secondary border border-primary-container transition-colors">USD</button>
<button class="flex-1 py-2 rounded-lg bg-surface-container-lowest text-on-surface-variant border border-outline-variant/40 hover:bg-surface-container-low transition-colors font-body-secondary text-body-secondary">EUR</button>
<button class="flex-1 py-2 rounded-lg bg-surface-container-lowest text-on-surface-variant border border-outline-variant/40 hover:bg-surface-container-low transition-colors font-body-secondary text-body-secondary">GBP</button>
<button class="flex-1 py-2 rounded-lg bg-surface-container-lowest text-on-surface-variant border border-outline-variant/40 hover:bg-surface-container-low transition-colors font-body-secondary text-body-secondary">BDT</button>
</div>
</div>
<div>
<label class="block font-caption text-caption text-on-surface-variant mb-2">পরিমাণ</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-headline-md text-headline-md">$</span>
<input class="w-full border border-outline-variant/40 rounded-lg pl-10 pr-4 py-3 bg-surface-container-lowest font-headline-md text-headline-md text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container" placeholder="০.০০" type="number" value="500"/>
</div>
</div>
</div>
<!-- Channel Selector -->
<div class="glass-panel rounded-xl p-internal-padding">
<label class="block font-caption text-caption text-on-surface-variant mb-3">যে মাধ্যমে টাকা এসেছে</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-primary-container/10 border border-primary-container/20 text-primary-container flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">account_balance</span>
                        Payoneer
                    </button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
                        Wise
                    </button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">payments</span>
                        Bank
                    </button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span>
                        অন্যান্য
                    </button>
</div>
</div>
<!-- Exchange Rate & Live Calculation -->
<div class="glass-panel rounded-xl p-internal-padding border border-primary-container/20 bg-[#EDF3FF]/50">
<label class="block font-caption text-caption text-on-surface-variant mb-1">ব্যাংক যে রেট দিয়েছে (Exchange Rate)</label>
<p class="font-caption text-[11px] text-outline mb-3">যে রেটে টাকা হাতে পেয়েছেন সেটাই লিখুন</p>
<div class="flex items-center gap-3">
<div class="relative flex-1">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-main">৳</span>
<input class="w-full border border-primary-container/30 rounded-lg pl-8 pr-3 py-2 bg-white text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container" type="number" value="107.55"/>
</div>
<span class="text-on-surface-variant">/ USD</span>
</div>
<div class="mt-4 pt-3 border-t border-outline-variant/20 flex justify-between items-center">
<span class="font-body-main text-on-surface-variant">মোট টাকা</span>
<span class="font-headline-md text-headline-md text-primary-container">৳ ৫৩,৭৭৫</span>
</div>
</div>
<!-- Safe Area Spacer -->
<div class="h-20"></div>
</div>
<!-- Fixed Action Button -->
<div class="p-4 bg-surface/92 backdrop-blur-2xl border-t border-outline-variant/20 sticky bottom-0 z-30 pb-safe">
<button class="w-full bg-primary-container text-on-primary py-3.5 rounded-xl font-body-main font-semibold shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-2 min-h-[48px]">
                সংরক্ষণ করুন
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
</div>
</div>
